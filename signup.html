<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up | BookHaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="auth-page">
      <div class="auth-card auth-card-wide">
        <div class="auth-mark">
          <i class="bi bi-book"></i><span>BookHaven</span>
        </div>
        <h1>Join our reading room</h1>
        <p class="muted">
          Create an account to save books and track your orders.
        </p>
        <form id="signup-form" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="signup-name" class="form-label">Full name</label
              ><input id="signup-name" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label for="signup-phone" class="form-label">Phone number</label
              ><input
                id="signup-phone"
                type="tel"
                class="form-control"
                required
              />
            </div>
            <div class="col-12">
              <label for="signup-email" class="form-label">Email address</label
              ><input
                id="signup-email"
                type="email"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="signup-password" class="form-label">Password</label
              ><input
                id="signup-password"
                type="password"
                class="form-control"
                minlength="6"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="signup-confirm" class="form-label"
                >Confirm password</label
              ><input
                id="signup-confirm"
                type="password"
                class="form-control"
                required
              />
            </div>
          </div>
          <div class="form-check my-4">
            <input
              id="terms"
              class="form-check-input"
              type="checkbox"
              required
            /><label class="form-check-label" for="terms"
              >I agree to the Terms &amp; Conditions.</label
            >
          </div>
          <div id="signup-message" class="form-message"></div>
          <button class="btn btn-primary w-100" type="submit">
            Create Account
          </button>
        </form>
        <p class="auth-switch">
          Already have an account?
          <a class="text-link" href="login.html">Login</a>
        </p>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
