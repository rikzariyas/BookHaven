<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout | BookHaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="page-shell">
      <div class="container">
        <div class="page-intro">
          <span class="eyebrow">Almost there</span>
          <h1>Checkout</h1>
          <p>Complete your details and we will prepare your order.</p>
        </div>
        <div class="row g-4">
          <div class="col-lg-7">
            <form id="checkout-form" class="checkout-card">
              <h2>Delivery details</h2>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="checkout-name">Full name</label
                  ><input id="checkout-name" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="checkout-email">Email</label
                  ><input
                    id="checkout-email"
                    type="email"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-12">
                  <label class="form-label" for="checkout-address"
                    >Address</label
                  ><textarea
                    id="checkout-address"
                    class="form-control"
                    rows="3"
                    required
                  ></textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="checkout-city">City</label
                  ><input id="checkout-city" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="checkout-pin">PIN code</label
                  ><input
                    id="checkout-pin"
                    class="form-control"
                    inputmode="numeric"
                    required
                  />
                </div>
              </div>
              <div id="checkout-message" class="form-message"></div>
              <button class="btn btn-primary mt-4" type="submit">
                Place Order <i class="bi bi-arrow-right ms-2"></i>
              </button>
            </form>
          </div>
          <div class="col-lg-5">
            <aside id="checkout-summary" class="summary-card"></aside>
          </div>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/books.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
