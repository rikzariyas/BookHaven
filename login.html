<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | BookHaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-mark">
          <i class="bi bi-book"></i><span>BookHaven</span>
        </div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to continue to your personal bookshelf.</p>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="login-email" class="form-label">Email address</label
            ><input
              id="login-email"
              type="email"
              class="form-control"
              required
            />
            <div class="invalid-feedback">
              Please enter a valid email address.
            </div>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label for="login-password" class="form-label">Password</label
              ><a href="#" class="small text-link">Forgot password?</a>
            </div>
            <input
              id="login-password"
              type="password"
              class="form-control"
              required
            />
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
          <div class="form-check mb-4">
            <input
              id="remember-me"
              class="form-check-input"
              type="checkbox"
            /><label class="form-check-label" for="remember-me"
              >Remember me</label
            >
          </div>
          <div id="login-message" class="form-message"></div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <p class="auth-switch">
          Don't have an account?
          <a class="text-link" href="signup.html">Sign Up</a>
        </p>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
